<!DOCTYPE HTML>
<html>
    <head>
        <style>
            body {
                margin: 0px;
                padding: 0px;
            }
            
            #myCanvas {
                border: 1px solid #9C9898;
            }
        </style>
        <script src="raphael.js">
	</script>
        <script>
            // TODO: (experentially, this is the death-knell...)
            // [x] Respond to hash-change
            // [ ] Classier palette
            // [ ] Sound selector
            // [ ] Numbers instead of dashes?
            // [ ] Better style
            // [ ] "Branding"
            // [ ] Adding/removing rings
            // [ ] Meta-cycles
            //      etc etc etc :(

            var xmlns = "http://www.w3.org/2000/svg";
            var paper, w=600, h=600, line;

            var codes = ["r", "g", "b"];
            var codeToColor = {"r":"red", "g":"green", "b":"blue"};

            var hash = false;
            var beatRings = [];

	    function TimeLoop(duration) {
	        this.duration = duration;
	        this.offsetHandlers = new Array();

	        this.onOffset = function(offset, handler) {
	            if (!this.offsetHandlers[offset]) {
			this.offsetHandlers[offset] = new Array();
		    }
		    this.offsetHandlers[offset].push(handler);
                };

	        this.unOffset = function(offset, handler) {
		    var i = this.offsetHandlers[offset].indexOf(handler);
		    if (i == -1) {
			console.log("IMPROPER HANDLER REMOVAL OMG");
		    } else {
			this.offsetHandlers[offset].splice(i, 1);
		    }
                };

	        this.run = function(offset) {
		    if (!offset || (offset == 1)) offset = 0;

		    var nextOffset = 1;
		    for (var key in this.offsetHandlers) {
			if (key > offset && key < nextOffset) {
			    nextOffset = key;
			}
		    }
		    var that = this;
		    setTimeout(function() {that.run(nextOffset)}, 
			       (nextOffset-offset)*duration);

		    for (var i in this.offsetHandlers[offset]) {
			this.offsetHandlers[offset][i]();
		    }
		};
	    }
	    
            var loopDuration,
                loop,
                audios = new Object();

            function playAudio(audio) {
		if (audio.readyState > 1) audio.currentTime=0;
		audio.play();
	    }

            function fillFromBeat(beatState) {
		return beatState ? codeToColor[beatState] : "white";
	    }

            function BeatRing(centerX, centerY, radius, n) {
		this.centerX = centerX;
		this.centerY = centerY
		this.radius = radius;
		this.n = n;
		this.beats = new Array();
		this.beatCircles = new Array();

		this.beatChangeHandlers = new Array();
                this.getBeat = function(index) {
		    return this.beats[index];
		};
		this.setBeat = function(index, newval) {
		    this.beats[index] = newval;

		    for (var i in this.beatChangeHandlers[index]) {
			this.beatChangeHandlers[index][i](newval);
		    }
		};
	        this.onBeatChange = function(index, handler) {
	            if (!this.beatChangeHandlers[index]) {
			this.beatChangeHandlers[index] = new Array();
		    }
		    this.beatChangeHandlers[index].push(handler);
                };

		this.getBeatLocation = function(index) {
	            var theta = index * 2 * Math.PI / this.n;
                    var x = this.centerX + Math.cos(theta)*this.radius;
                    var y = this.centerY + Math.sin(theta)*this.radius;
		    return [x, y];
		};


		this.toString = function() {
		    var ret = "";
		    for (var i = 0; i < n; i++) {
			ret += this.beats[i] ? this.beats[i] : "-";
		    }
		    return ret;
		}

		this.bounce = function() {
		    //this.animate({"r":60}, 200, ">", function() {});
		};

		this.remove = function() {
		    this.track.remove();
		    for (var i = 0; i < n; i++) {
			this.beatCircles[i].remove();
		    }
		}

		this.track = paper.circle(centerX, centerY, radius)
		                  .attr("stroke-width", 4);
		for (var i = 0; i < n; i++) {
		    this.beatCircles[i] = new BeatCircle(this, i);
		    this.setBeat(i, false);
		}
            }

            function BeatCircle(beatRing, index) {
		var that = this;
		this.beatRing = beatRing;
		this.index = index;
		this.palette = null;

		// location info
		var loc = beatRing.getBeatLocation(index);
		var x = loc[0], y = loc[1];

		this.circle = paper.circle(x, y, 20)
		    .attr({"stroke-width":4, "fill":"white"})
                    .mouseover(function () {
			that.palette = new Palette(that.beatRing, that.index);})
		    .click(function () {
			that.beatRing.setBeat(that.index, false);
			updateHash();});
		beatRing.onBeatChange(index, function(newval) {
		    that.circle.attr("fill", fillFromBeat(newval));});
		this.beatHandler = function () {
		    if (that.beatRing.getBeat(index)) {
			console.log("boof: " + (index/beatRing.n));
			playAudio(audios[beatRing.getBeat(index)]);
			that.circle.attr("fill", "black");
			that.circle.animate({"fill":codeToColor[that.beatRing.getBeat(index)]},100);
			that.beatRing.bounce();
		    }}
		loop.onOffset(index/beatRing.n, this.beatHandler);

		this.remove = function () {
		    loop.unOffset(index/beatRing.n, this.beatHandler);
		    this.circle.remove();
		}
	    }

	    function Palette(beatRing, index) {
		var that = this;

		this.beatRing = beatRing;
		this.index = index;

		this.pieces = new Object();
		this.pieces["bghack"] = paper.rect(0, 0, w, h)
                                             .attr({"fill":"black",
						    "fill-opacity":0,
						    "stroke-opacity":0});
		// (setting "fill":"black" is necessary to properly detect
		// mouse-click events. weird as all hell.)

	        var theta = index * 2 * Math.PI / beatRing.n;
                var centerX = beatRing.centerX + Math.cos(theta)*beatRing.radius;
                var centerY = beatRing.centerY + Math.sin(theta)*beatRing.radius;
		this.pieces["back"] = paper.circle(centerX, centerY, 20)
		                 .attr({"stroke-width":4, "fill":"black"})
		                 .animate({"r":60}, 100, ">", function() {
				     that.drawCols();});
		this.pieces["center"] = paper.circle(centerX, centerY, 20)
		    .attr({"stroke-width":4,
			   "fill":fillFromBeat(beatRing.getBeat(index))});
		beatRing.onBeatChange(index, function(newval) {
		    that.pieces["center"].attr("fill", fillFromBeat(newval));});
		this.pieces["center"].click(function () {
		    that.beatRing.setBeat(index, false);
		    updateHash();
		});

		this.drawCols = function() {
		    for (var i = 0; i < codes.length; i++) {
			var code = codes[i];
			var psi = i * 2 * Math.PI / codes.length;
			var gap = 4;

			var r1 = 25;
			var r2 = 55;

			var psi1 = psi;
			var psi2 = psi + 2*Math.PI/codes.length;
			var xA = centerX + Math.cos(psi1+gap/r1)*r1;
			var yA = centerY + Math.sin(psi1+gap/r1)*r1;
			var xB = centerX + Math.cos(psi2-gap/r1)*r1;
			var yB = centerY + Math.sin(psi2-gap/r1)*r1;
			var xC = centerX + Math.cos(psi2-gap/r2)*r2;
			var yC = centerY + Math.sin(psi2-gap/r2)*r2;
			var xD = centerX + Math.cos(psi1+gap/r2)*r2;
			var yD = centerY + Math.sin(psi1+gap/42)*r2;
			that.pieces[i] = paper.path(
			    "M"+xA+","+yA
				+"A"+r1+","+r1+",0,0,1,"+xB+","+yB
                                +"L"+xC+","+yC
                                +"A"+r2+","+r2+",0,0,0,"+xD+","+yD+"Z")
                            .attr({"fill":codeToColor[code]});
			(function (i) {
			    that.pieces[i].click(function () {
				that.beatRing.setBeat(index, codes[i]);
				updateHash();
			    });
			})(i);

			/*
			var x = centerX + Math.cos(psi)*40;
			var y = centerY + Math.sin(psi)*40;
			that.pieces[i] = paper.circle(x, y, 20)
		            .attr({"stroke-width":4, "fill":codeToColor[code]});
			*/

		    }
		}

		this.remove = function() {
		    for (var i = 0; i < codes.length; i++) {
			that.pieces[i].remove();
		    }
		    that.pieces["back"].animate({"r":0}, 500, ">", function () {
			for (var piece in that.pieces) {
			    that.pieces[piece].remove();
			}
		    });
		}

		that.pieces["bghack"].mousemove(function () {
		    that.remove()
		});

	    }

            function getTime() {
		return (new Date()).getTime();
	    }

	    function drawHand(startTime) {
		var deltaT = getTime() - startTime;
		if (deltaT < loopDuration) {
		    setTimeout(function() {drawHand(startTime);}, 10);
		}

	        var theta = deltaT * 2 * Math.PI / loopDuration;
		var x1 = w/2 + Math.cos(theta)*30;
		var y1 = h/2 + Math.sin(theta)*30;
                var x2 = w/2 + Math.cos(theta)*240;
                var y2 = h/2 + Math.sin(theta)*240;

	        var pathString = "M" + x1 + "," + y1 + "L" + x2 + "," + y2;
	        line.attr("path", pathString);
	    }

            function updateHash() {
		window.location.hash = "" + loopDuration;
		for (var i = 0; i < beatRings.length; i++) {
		    var beatRing = beatRings[i];
		    window.location.hash += "/" + beatRing.toString();
		}
		hash = window.location.hash;
	    }

            function populateFromHash(hash) {
		for (var i in beatRings) {
		    beatRings[i].remove();
		}
		beatRings = [];
		
		var parts = hash.substring(1,hash.length).split("/");
		newLoopDuration = parseInt(parts[0]);
		if (newLoopDuration != loopDuration) {
		    loopDuration = newLoopDuration;
		    loop = new TimeLoop(loopDuration);
		}
		for (var i = 1; i < parts.length; i++) {
		    var part = parts[i];
		    var curRing = new BeatRing(w/2, h/2, 100+50*(i-1), part.length);
		    for (var j = 0; j < part.length; j++) {
			curRing.setBeat(j, part[j] == "-" ? false : part[j]);
		    }
		    beatRings.push(curRing);
		}
	    }

            function watchHash() {
		var lastHash = hash;
		hash = window.location.hash;
		if (hash != lastHash) {
		    console.log("hash changed from " + lastHash + " to " + hash);
		    populateFromHash(hash);
		}
	    }
            
            window.onload = function() {
		audios = {"r":document.getElementById("audio1"),
			  "g":document.getElementById("audio2"),
			  "b":document.getElementById("audio3")};

		paper = Raphael("canvas", w, h);
	        line = paper.path("").attr("stroke-width", 4);

		var hash = window.location.hash;
		if (hash) {
		    // Fragment exists!
		    populateFromHash(hash);
		} else {
		    loopDuration = 1000;
		    loop = new TimeLoop(loopDuration);
		    beatRings.push(new BeatRing(w/2, h/2, 100, 6));
		    beatRings.push(new BeatRing(w/2, h/2, 150, 16));
		    updateHash();
		}
		hash = window.location.hash;
		setInterval(watchHash, 200);


		loop.onOffset(0,
			      function() {drawHand(getTime());});
		loop.run();
            };
        </script>
    </head>
    <body onmousedown="return false;">
        <div id="canvas"></div>
        <audio id="audio1" src="hat5.wav" preload="auto" autobuffer> </audio>
        <audio id="audio2" src="clap8.wav" preload="auto" autobuffer> </audio>
        <audio id="audio3" src="snare16.wav" preload="auto" autobuffer> </audio>
    </body>
</html>

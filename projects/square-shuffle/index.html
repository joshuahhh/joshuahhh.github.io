<!DOCTYPE html>
<html>
  <head>
    <title>square shuffle</title>
    <style>
      body {
        margin: 0px;
        padding: 0px;
      }

      #canvas {
        display: block;
        margin-left: auto;
        margin-right: auto;
        padding: 0px;
        cursor: row-resize;
      }

      #menu, #unfold {
        position: fixed;
        right: 0px;
        bottom: 0px;
        text-align: right;
        color: black;
        text-shadow:
          -1px -1px 1px white,
           1px -1px 1px white,
          -1px  1px 1px white,
           1px  1px 1px white;
      }

      #menu #unfold {
        visibility: hidden;
      }

      #menu:hover #unfold {
        visibility: visible;
      }
    </style>

    </style>
  </head>
  <body>
    <script src="square-shuffle.js"></script>
    <canvas width="1" height="1" id="canvas"></canvas>
    <div id="menu">
      <div id="unfold">
	square shuffle (by <a href="http://joshuahhh.com/">joshuahhh</a>) &#x2b24;
      </div>
      &#x2b24;
    </div>
  </body>
</html>

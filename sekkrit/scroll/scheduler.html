<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="utf-8">
    <link rel="stylesheet" type="text/css" href="bootstrap-journal.css">
    <style>body {
  background-color: #fbfbfb;
}

svg {
  border: 1px solid lightgray;
}

.axis {
  shape-rendering: crispEdges;
}

.axis line {
  stroke: #fff;
}

.axis .minor {
  stroke-opacity: .5;
}

path.line {
  fill: none;
  stroke: #666;
  stroke-width: 1.5px;
}

.axis line, .axis path {
  fill: none;
  stroke: #000;
}

.row .divider {
  fill: none;
  stroke: #CCC;
}

.row .background {
  opacity: 0
}

.bar {
  fill: gray;
  cursor: pointer;
}

.bar:hover {
  stroke: black;
}

.bar.drag-source {
  fill: lightgray;
}

.bar.fake-ok {
  fill: none;
  stroke: black;
  stroke-dasharray: 5,5;
}

.bar.fake-not-ok {
  fill: none;
  stroke: red;
  stroke-dasharray: 5,5;
}
</style>
  </head>
  <body>
    <div class="container">
      <div class="page-header">
        <h1>Scheduling</h1>
      </div>
      <div class="row">
        <div class="col-md-6">
          <svg width="500" height="500" class="schedule-grid"></svg>
        </div>
      </div>
    </div>
    <script src="react-with-addons-10.js"></script>
    <script src="underscore.js"></script>
    <script src="jquery.js"></script>
    <script src="d3.js"></script>
    <script src="utils.js"></script>
    <script src="scheduler2.js"></script>
  </body>
</html>
